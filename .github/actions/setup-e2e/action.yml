name: Set up offline E2E environment
description: Install process inspection and configure Node.js with the Yarn cache.
runs:
  using: composite
  steps:
    - name: Install process inspection tool
      shell: bash
      run: |
        apt-get update
        apt-get install -y --no-install-recommends lsof

    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: yarn
