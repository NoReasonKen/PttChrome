name: Android APK

# Native shell and release-record validation; reading-page deployment is separate.
# Branches/PRs run JVM tests and build an APK artifact.
# Fork release tags publish the signed APK, license, metadata and tracked notes.
on:
  push:
    branches: [dev]
    tags: ['android-fork-v*']
    paths: ['android/**', 'releases/**', 'scripts/release*.mjs', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'releases/**', 'scripts/release*.mjs', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Validate release signing inputs
        if: startsWith(github.ref, 'refs/tags/android-fork-v')
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for input in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!input}" ]; then
              echo "::error::Release tags require the $input secret."
              exit 1
            fi
          done

      # 簽章 keystore 只存在 secrets（不入 repo）。沒設定時（例如 fork 的 PR）照樣跑 test，
      # 只是 release APK 不簽，改上傳 debug APK。
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.p12
            echo "ANDROID_KEYSTORE_FILE=release.p12" >> "$GITHUB_ENV"
          fi

      - name: Version
        run: |
          echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/android-fork-v* ]]; then
            echo "ANDROID_VERSION_NAME=${GITHUB_REF#refs/tags/android-fork-v}" >> "$GITHUB_ENV"
          else
            echo "ANDROID_VERSION_NAME=0.0.${{ github.run_number }}-dev" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon test assembleRelease
            cp app/build/outputs/apk/release/app-release.apk pttchrome.apk
          else
            ./gradlew --no-daemon test assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk pttchrome.apk
          fi

      - name: Verify release signature
        if: env.ANDROID_KEYSTORE_FILE != ''
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ]; then
            echo '::error::Android SDK location is unavailable for signature verification.'
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo '::error::Android build-tools apksigner is required for release verification.'
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs pttchrome.apk

      - name: Prepare update artifacts
        if: startsWith(github.ref, 'refs/tags/android-fork-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt2="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt2 | sort -V | tail -n 1)"
          if [ -z "$aapt2" ]; then
            echo '::error::Android build-tools aapt2 is required for release metadata.'
            exit 1
          fi
          "$aapt2" dump badging pttchrome.apk > apk-badging.txt
          node ../scripts/release-records.mjs assets \
            --version "$ANDROID_VERSION_NAME" \
            --version-code "$ANDROID_VERSION_CODE" \
            --source "$GITHUB_SHA" \
            --apk pttchrome.apk --badging apk-badging.txt --output-dir .

      - uses: actions/upload-artifact@v7
        with:
          name: pttchrome-apk
          path: android/pttchrome.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-fork-v') && env.ANDROID_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ../LICENSE LICENSE
          gh release create "$GITHUB_REF_NAME" pttchrome.apk LICENSE update.json \
            --draft \
            --verify-tag \
            --title "Android $ANDROID_VERSION_NAME" \
            --notes-file release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
