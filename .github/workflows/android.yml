name: Android APK

# android/ 的建置與發佈（docs/android-app.md）。網頁本體仍由 deploy.yml 部署到 GitHub Pages，
# APK 只是載入它的殼，所以這裡只看 android/ 的變動。
#   push dev／PR：JVM unit test ＋ 產 APK（artifact）
#   push tag android-fork-v*（繼承自 upstream 的 android-v* 不觸發）：同上，並建立 GitHub Release 附上簽章 APK
on:
  push:
    branches: [dev]
    tags: ['android-fork-v*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Validate release signing inputs
        if: startsWith(github.ref, 'refs/tags/android-fork-v')
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for input in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!input}" ]; then
              echo "::error::Release tags require the $input secret."
              exit 1
            fi
          done

      # 簽章 keystore 只存在 secrets（不入 repo）。沒設定時（例如 fork 的 PR）照樣跑 test，
      # 只是 release APK 不簽，改上傳 debug APK。
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.p12
            echo "ANDROID_KEYSTORE_FILE=release.p12" >> "$GITHUB_ENV"
          fi

      - name: Version
        run: |
          echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/android-fork-v* ]]; then
            echo "ANDROID_VERSION_NAME=${GITHUB_REF#refs/tags/android-fork-v}" >> "$GITHUB_ENV"
          else
            echo "ANDROID_VERSION_NAME=0.0.${{ github.run_number }}-dev" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon test assembleRelease
            cp app/build/outputs/apk/release/app-release.apk pttchrome.apk
          else
            ./gradlew --no-daemon test assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk pttchrome.apk
          fi

      - name: Verify release signature
        if: env.ANDROID_KEYSTORE_FILE != ''
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ]; then
            echo '::error::Android SDK location is unavailable for signature verification.'
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo '::error::Android build-tools apksigner is required for release verification.'
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs pttchrome.apk

      - uses: actions/upload-artifact@v7
        with:
          name: pttchrome-apk
          path: android/pttchrome.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-fork-v') && env.ANDROID_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ../LICENSE LICENSE
          printf '%s\n' \
            "PttChrome Android App $ANDROID_VERSION_NAME." \
            '' \
            'Download pttchrome.apk on your Android phone and open it to install. Allow installation from your browser when Android asks.' \
            'Future updates require the same application ID and signing key; install the newer APK over this version.' \
            '' \
            "Installation guide: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/android-app.md" \
            "Corresponding source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME" \
            "Source archive: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" \
            'License: GPL-2.0-only; the license text is attached as LICENSE.' \
            > release-notes.md
          gh release create "$GITHUB_REF_NAME" pttchrome.apk LICENSE \
            --verify-tag \
            --title "Android $ANDROID_VERSION_NAME" \
            --notes-file release-notes.md
